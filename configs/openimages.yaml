# Generated by scripts/prepare_openimages.py / prepare_lvis.py
seed: 42
device: auto
classes:
- apple
- banana
- orange
- lemon
- mango
- grape
- strawberry
- pineapple
- pear
- peach
- pomegranate
- grapefruit
- watermelon
- cantaloupe
- fig
- apricot
- avocado
- blackberry
- blueberry
- cherry
- mandarin
- coconut
- date
- kiwi
- lime
- melon
- papaya
- persimmon
- raspberry
pretrained_class_map:
  apple: apple
  orange: orange
  banana: banana
models:
  detection:
    name: yolo11n-det
    weights: models/yolo11n.pt
  segmentation:
    name: yolo11n-seg
    weights: models/yolo11n-seg.pt
inference:
  imgsz: 640
  batch: 1
  conf: 0.25
  iou: 0.7
  max_det: 300
  eval_conf: 0.001
  preprocess: none
evaluation:
  match_iou: 0.5
  mape_zero_policy: skip
  dataset_root: data/processed/openimages_fruit
  split: test
tracking:
  tracker: bytetrack
  min_track_frames: 3
paths:
  predictions: outputs/predictions
  visualizations: outputs/visualizations
  reports: outputs/reports
