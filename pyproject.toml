[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fruitcount"
version = "0.1.0"
description = "Fruit detection, segmentation, counting and tracking with YOLO-family models"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26", "opencv-python>=4.8", "PyYAML>=6.0", "pandas>=2.0",
  "scipy>=1.11", "ultralytics>=8.3", "torch>=2.1", "gradio>=5.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.4"]
track = ["lapx>=0.5.5"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = ["slow: needs model weights / dataset (deselect with -m 'not slow')"]
